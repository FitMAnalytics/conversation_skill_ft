# TSE SFT training run config — TEACHER-COT VARIANT (2025-05-20).
# Loaded by `02_sft_training_cot_0520.py --config <path>`.
# CLI flags override individual values.
#
# Differences from `02_train_config_nocot.yaml`:
#   - Adds analysis-channel supervision (teacher CoT).
#   - Prompt templates (system + user) live in this YAML, not in Python.
#   - `include_previous_call_summary` toggle drops the PREV section at render.
#   - `objection_summary` is dropped from the input fields.
#   - Default model is gpt-oss-20B; swap `model_dir` for 120B without other changes.
#   - Channel loss weights default to literal half/half (0.5 / 0.5).
#   - No in-script train/val split: all rows train; pick the right checkpoint
#     by running 03_inference_cot_0520.py against your held-out test set.

# ---- paths ----
model_dir: /path/to/gpt-oss-20b           # swap to /path/to/gpt-oss-120b for the larger model
input: data/preprocessed.jsonl
output_dir: checkpoints_cot_0520

# ---- prompt templates ----
# The gpt-oss Harmony chat template auto-routes `{"role": "system"}` content into
# the `developer` block under `# Instructions`. You still author your task
# instructions here as `system_prompt`; the script handles the rest. The first
# rendered prompt is logged at startup so you can verify visually.
system_prompt: |
  You are working on the TSE outbound sales channel. You will be given the
  customer's context (customer information + product context), a summary of prior
  calls with this customer, a summary of how the current call has gone so far,
  and the verbatim transcript of the current call up to the latest customer turn.

  Your job has two parts, one per channel.

  In the ANALYSIS channel, reason about what the agent should do next. Identify
  what the customer is signaling in their latest turn, what kind of barrier or
  opportunity that represents, what move would actually advance the conversation,
  and why. Use flowing natural prose — no bullets, no headers, no enumerated
  steps. Write in the third person, reasoning as an analyst would about what
  response the agent should produce (e.g., "the best move is to..."; "the
  response should..."). Reason as much as the case warrants and no more.

  In the FINAL channel, produce a concise summary of the substantive moves the
  agent makes in their next turn. Follow these rules:

  - Write 2-4 sentences of flowing prose.
  - Each sentence describes one substantive move and begins with "The agent".
  - Use present-tense action verbs such as explains, describes, offers,
    proposes, reassures, asks, confirms, reframes, or similar.
  - Capture the substance of each move (what is explained, what is offered,
    what is asked) without quoting or paraphrasing the agent's words.
  - Skip conversational scaffolding: do not include acknowledgments, empathy
    statements, rapport language, or filler. Only substantive informational,
    offer, or question moves.
  - Include a forward-looking move (the agent asks about X, the agent proposes
    next steps) only when the turn genuinely contains one. Do not append one
    formulaically.

  Two examples of the analysis-then-final pattern follow. Each shows the
  analysis-channel reasoning paired with the final-channel summary it produces.

  --- Example 1 (substantive objection: busy / process barrier) ---

  ANALYSIS:
  The customer is signaling a process barrier rather than a value or trust
  barrier — they're too busy, and they believe identifying Amex-accepting
  vendors takes too long. They already use Amex occasionally and have declined
  loans and credit, so we're in needs discovery with neutral engagement. If the
  effort were low, they might be open to learning more. The best move is not to
  push product or a long review, but to remove the perceived workload by
  explaining a fast, low-lift way to identify Amex-accepting vendors. Offering
  a concrete, time-bounded deliverable (a quick report and a simple Excel list)
  makes the benefit tangible without disrupting their current bank processes.
  The tone should be concise, reassuring, and efficiency-focused, emphasizing
  updated and accurate information rather than credit or long reviews.

  FINAL:
  The agent explains that their process quickly identifies vendors accepting
  Amex. The agent describes how a five-minute report and an Excel file simplify
  the identification. The agent reassures the customer the process is efficient
  and provides updated information.

  --- Example 2 (discovery / info-gathering turn) ---

  ANALYSIS:
  The customer has been receptive and has shared that they handle vendor
  payments through a mix of ACH and check, but hasn't yet revealed the volume
  or the categories of spend that would qualify for Amex conversion. Without
  that, any specific recommendation would be premature. We're early in
  discovery with engaged sentiment, so the best move is to surface the spend
  composition before introducing any solution. The response should ask
  concretely about monthly spend volume and the largest vendor categories,
  framed as gathering information needed to bring a tailored recommendation
  rather than as gatekeeping. Tone should be consultative and unhurried,
  signaling that the agent is fitting the conversation to the customer's
  business rather than running a script.

  FINAL:
  The agent asks about the customer's approximate monthly spend on vendor
  payments. The agent asks which vendor categories represent the largest share
  of that spend. The agent explains that this information will help shape a
  tailored recommendation.

  --- End examples ---


# Python format-string template. Available placeholders:
#   {customer_context}, {previous_calls_summary}, {current_call_summary}, {transcript}
#
# The <<PREV_CALL_SECTION>> ... <<END>> markers delimit the optional
# previous-calls block. When `include_previous_call_summary: false`, the entire
# block (markers + body) is stripped before format-substitution, and
# {previous_calls_summary} is not requested from the row. When true, just the
# marker lines are removed and the body is kept.
user_prompt_template: |
  CUSTOMER CONTEXT:
  {customer_context}

  <<PREV_CALL_SECTION>>
  PREVIOUS CALL SUMMARY:
  {previous_calls_summary}
  <<END>>

  CURRENT CALL SUMMARY:
  {current_call_summary}

  CURRENT TRANSCRIPT (up to the latest customer turn):
  {transcript}

include_previous_call_summary: true       # set false to drop the PREV section entirely

# ---- data field names in the JSONL ----
transcript_field: transcript
previous_call_summary_field: previous_calls_summary    # NOTE: plural, per 01_preprocessing.py
current_call_summary_field: current_call_summary
customer_context_field: customer_context               # pre-rendered upstream
analysis_target_field: teacher_cot                     # analysis-channel SFT target
final_target_field: polished_response                  # final-channel SFT target

# ---- tokenization ----
# Char-based transcript trim: keep at most this many characters from the END
# of the transcript (~2000 words at 6 chars/word).
max_transcript_chars: 12000
max_seq_len: 4096
max_samples: null    # smoke-test cap; null = use all

# ---- channel loss weights ----
# Per-example per-channel-mean formulation:
#   loss_a = mean(ce[mask == 1])
#   loss_f = mean(ce[mask == 2])
#   loss   = w_analysis * loss_a + w_final * loss_f      (per example)
# Batch loss = mean(per-example loss across the batch).  ← .mean() is in code.
# Defaults below give literal half/half (total magnitude ~ a single-channel loss).
w_analysis: 0.5
w_final: 0.5

# ---- LoRA ----
lora_r: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

# ---- optimization ----
learning_rate: 1.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
per_device_train_batch_size: 1
gradient_accumulation_steps: 8        # effective batch = 1 * 8 * num_gpus
num_train_epochs: 3
gradient_checkpointing: true
max_grad_norm: 1.0
optim: adamw_torch_fused

# ---- checkpointing & logging ----
# Checkpoint cadence is in OPTIMIZER STEPS, not raw rows.
# One optimizer step processes:
#   per_device_train_batch_size * gradient_accumulation_steps * num_gpus
# = 1 * 8 * N rows with the defaults above. So `save_steps: 30` with N GPUs
# writes a checkpoint every 240 * N training rows. Halve for tighter cadence,
# double for fewer dirs. `save_total_limit` rolls oldest checkpoints out —
# raise it if you want every checkpoint preserved for later A/B on a held-out
# test set via 03_inference_cot_0520.py --adapter-dir checkpoints_cot_0520/checkpoint-N.
save_steps: 30
save_total_limit: 10
logging_steps: 5
report_to: tensorboard

# ---- misc ----
seed: 42
bf16: true
