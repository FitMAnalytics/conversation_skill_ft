# TSE SFT training run config — NO-TEACHER-COT VARIANT.
# Loaded by `02_sft_training_nocot_0511.py --config <path>`.
# CLI flags override individual values. Yi: update paths and field names.
#
# Differences from `02_train_config.yaml`:
#   - `reasoning_field` removed (this variant doesn't read teacher CoT).
#   - `w_analysis` / `w_final` removed (only the final channel is supervised).
#   - `output_dir` defaults to `checkpoints_nocot` so it doesn't clobber the
#     teacher-CoT run's adapters.

# ---- paths ----
model_dir: /path/to/gpt-oss-120b
input: data/preprocessed.jsonl
output_dir: checkpoints_nocot

# ---- data field names in the JSONL ----
# Falls back to "cust_id" if customer_id_field is missing on a row.
# Customer-context construction is via get_customer_context(row) in the script
# (PLACEHOLDER — edit there to match your schema).
customer_id_field: customer_id
transcript_field: transcript
previous_call_summary_field: previous_call_summary
current_call_summary_field: current_call_summary
objection_summary_field: objection_summary
polished_target_field: polished_target  # final-channel target

# ---- tokenization ----
# Char-based transcript trim: keep at most this many characters from the END
# of the transcript (~2000 words at 6 chars/word).
max_transcript_chars: 12000
max_seq_len: 4096
max_samples: null    # smoke-test cap; null = use all

# ---- split ----
val_fraction: 0.10
split_seed: 42

# ---- LoRA ----
lora_r: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

# ---- optimization ----
learning_rate: 1.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8        # effective batch = 1 * 8 * num_gpus
num_train_epochs: 3
gradient_checkpointing: true
max_grad_norm: 1.0
optim: adamw_torch_fused

# ---- checkpointing & logging ----
save_steps: 30
save_total_limit: 10
eval_steps: 30
logging_steps: 5
report_to: tensorboard

# ---- misc ----
seed: 42
bf16: true
